# Windowed config -- natural size, floating, normal decoration, for
# clients the user needs a visible, obvious way to close (the installer,
# VPXConfig) instead of a fixed-layout app stretched to fill the whole
# output. Matches the old weston-installer.ini/desktop-shell behavior.
# Used for client_name "installer", "vpxconfig", "vpinos-config", or the
# reserved "windowed" name any arbitrary third-party app can opt into
# (see vpinos-launch); filename predates the vpxconfig use, same as the old
# weston one did.
#
# No real title bar/close button ever renders here, for any client --
# confirmed directly, not assumed (a real WiVRn dashboard test): Hyprland
# advertises both decoration protocols (zxdg_decoration_manager_v1,
# org_kde_kwin_server_decoration_manager, per `wayland-info` on a real
# boot) and clients correctly trust that and skip drawing their own
# client-side decoration (confirmed via QT_DEBUG_PLUGINS=1 -- Qt never
# even attempts to load a wayland-decoration-client plugin), but
# Hyprland itself only ever renders border/shadow/glow for "server-side"
# windows, never an actual title bar or button -- confirmed as
# hardcoded, not configurable, via `strings` on the shipped Hyprland
# binary (CXDGDecoration::xdgDefaultModeCSD()/kdeDefaultModeCSD() exist
# as compiled-in C++ methods, not exposed hyprland.conf keys -- same
# non-existent-key pattern as `render:explicit_sync` in hyprland.conf's
# own comment). Not fixable from this file. The close keybind below is
# the actual way to close a windowed app without a title bar.
xwayland {
    enabled = true
}

# Forces workspace 1 active right at startup -- same reasoning as
# hyprland.conf's own copy of this line.
exec-once = hyprctl dispatch workspace 1

# Same two startup-warning suppressions as hyprland.conf -- these are
# compositor startup checks, not client-specific, so they'd otherwise
# show here too. See that file's comment for the full reasoning.
misc {
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    disable_splash_rendering = true
}

general {
    gaps_in = 4
    gaps_out = 8
}

# no_hardware_cursors: same nvidia compatibility setting as
# hyprland.conf's own copy of this line -- see that file's comment for
# the full reasoning (a real vpxconfig rendering report under "nvidia"
# mode is what prompted adding this, though the specific symptom
# reported was invisible controls, not cursor corruption -- this is a
# standard companion fix from the same source, not a confirmed fix for
# that exact symptom).
cursor {
    no_hardware_cursors = true
}

# Catch-all: float instead of tile, so a single window doesn't get
# stretched to fill the output the way Hyprland's default tiling layout
# would do even without an explicit fullscreen rule. `float` ran on a
# real boot with no "config option does not exist" error (unlike
# `no_border` in hyprland.conf, which failed loudly the same way) --
# indirect confirmation it's a real property, though whether it actually
# produces a floating, correctly-sized window still hasn't been
# confirmed visually (the installer crashes at the Xwayland protocol
# level before that could be observed -- see the xwayland block above).
windowrule {
    name = windowed-float
    match:class = .*
    float = 1
}

# Close keybind -- the real "visible, obvious way to close" promised
# above, now that a real title bar/close button is confirmed never
# achievable here (see this file's top comment). SUPER+Q, Hyprland's
# own conventional default bind for killactive in its example configs
# -- not reused from anywhere else in this project (no other binds
# exist anywhere in either Hyprland config; this is the first).
# killactive asks the client to close via its normal window-close path
# (same as clicking a real close button would), not a forced kill --
# matches what vpxconfig's own in-page Quit button already does.
bind = SUPER, Q, killactive

# Exit keybind -- last-resort way back to vpinos-menu when the client is
# gone or hung and the screen is stuck (a real report: VPX vanished and
# Hyprland stayed up with nothing on screen). `exit` stops the
# compositor itself, which ends vpinos-launch (it exec'd Hyprland), so the
# menu comes back.
bind = SUPER SHIFT, Escape, exit

# Window-switching keybind -- for when more than one "windowed"-type
# app ends up running at once (float, no tiling here -- see the
# windowed-float rule above -- so a later window can sit directly on
# top of an earlier one with no way back to it otherwise). cyclenext
# changes which window is focused; bringactivetotop then actually
# raises it, since a floating window doesn't auto-raise just because
# it's focused. SUPER+Tab rather than the traditional ALT+Tab, to stay
# consistent with SUPER as this project's one modifier key (see
# killactive above) -- a community convention, not something Hyprland
# itself defaults to; exact dispatcher behavior not yet confirmed
# against a real multi-window session, same caveat as killactive had
# before its own first real test.
bind = SUPER, Tab, cyclenext
bind = SUPER, Tab, bringactivetotop
