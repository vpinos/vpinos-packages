# kmscon on tty1, the console vpinos-menu runs in (see
# /usr/libexec/vpinos/vpinos-kmscon). vpinos-core's postinst points
# getty.target at this unit instead of getty@tty1; other VTs keep
# agetty, since each kmscon would hold the GPU open.
#
# ExecStartPre: the GPU driver switch (Setup > GPU Driver) has to
# unload the old driver, which can't happen while kmscon holds its DRM
# device open -- so it runs here, before kmscon starts, at boot and on
# every restart vpinos-menu triggers after a change
# (vpinos-console-restart.sh). vpinos-launch still calls it before
# each Hyprland start, where it then finds the right driver already
# loaded and does nothing. `-`: a failed switch (no NVIDIA hardware,
# Secure Boot) still leaves a console.
[Unit]
After=vpinos-console-rotation.service

[Service]
ExecStartPre=-/usr/libexec/vpinos/vpinos-gpu-driver.sh
ExecStart=
ExecStart=/usr/libexec/vpinos/vpinos-kmscon %I
