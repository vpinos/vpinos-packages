name: Release package

# One release per tag:
#   core-vX.Y.Z      -> vpinos-core X.Y.Z (must match vpinos-core/debian/changelog)
#   platform-vX.Y.Z  -> vpinos-platform X.Y.Z (amd64 + arm64) and
#                       vpinos-nvidia-modules-<kernel> (amd64), built from
#                       versions.env (PLATFORM_VERSION must be X.Y.Z)
# The release gets the .debs + .deb.sha256 files, which is what deb-repo's
# "Update apt repository" workflow publishes from (run it with
# source_repo=vpinos/vpinos-packages and this tag).
on:
  push:
    tags:
      - "core-v*"
      - "platform-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build builder image
        run: docker build -t vpinos-packages-builder .

      - name: Check tag matches the version
        run: |
          case "$GITHUB_REF_NAME" in
            core-v*)
              tag_ver="${GITHUB_REF_NAME#core-v}"
              ver="$(docker run --rm -v "$PWD:/work" -w /work vpinos-packages-builder \
                dpkg-parsechangelog -l vpinos-core/debian/changelog -S Version)"
              where="vpinos-core/debian/changelog"
              ;;
            platform-v*)
              tag_ver="${GITHUB_REF_NAME#platform-v}"
              ver="$(. ./versions.env; echo "$PLATFORM_VERSION")"
              where="versions.env PLATFORM_VERSION"
              ;;
          esac
          if [ "$tag_ver" != "$ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $where ($ver)" >&2
            exit 1
          fi

      - name: Build
        run: |
          case "$GITHUB_REF_NAME" in
            core-v*)     ./build.sh vpinos-core ;;
            platform-v*) ./build-platform.sh ;;
          esac

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            core-v*)     title="vpinos-core ${GITHUB_REF_NAME#core-v}" ;;
            platform-v*) title="vpinos-platform ${GITHUB_REF_NAME#platform-v}" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.deb.sha256 \
            --title "$title" \
            --notes "$title. Publish with deb-repo's \"Update apt repository\" workflow (source_repo=vpinos/vpinos-packages, tag $GITHUB_REF_NAME)."
